name: VMU regressions

on:
  pull_request:
    paths:
      - 'core/**'
      - 'shell/android-studio/**'
      - 'tests/vmu/**'
      - '.github/workflows/vmu-regressions.yml'
  push:
    branches: [dev, master]
    paths:
      - 'core/**'
      - 'shell/android-studio/**'
      - 'tests/vmu/**'
      - '.github/workflows/vmu-regressions.yml'

permissions:
  contents: read

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install SDL (Linux)
        if: runner.os == 'Linux'
        run: |
          # The runner's Azure HTTP mirror can stall before the VMU tests start.
          # Keep the mirror fallback on HTTPS and bound each network attempt.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y libsdl2-dev xvfb
      - name: Install SDL (macOS)
        if: runner.os == 'macOS'
        run: brew list sdl2 >/dev/null 2>&1 || brew install sdl2
      - name: Configure
        run: cmake -S tests/vmu -B build/vmu-tests
      - name: Build
        run: cmake --build build/vmu-tests --config Release --parallel 4
      - name: Test (Linux)
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a ctest --test-dir build/vmu-tests -C Release --output-on-failure
      - name: Test (macOS)
        if: runner.os == 'macOS'
        run: ctest --test-dir build/vmu-tests -C Release --output-on-failure
      - name: Test (Windows)
        if: runner.os == 'Windows'
        # Native Win32 pointer/focus tests require an unlocked interactive desktop.
        run: ctest --test-dir build/vmu-tests -C Release --output-on-failure -LE interactive
