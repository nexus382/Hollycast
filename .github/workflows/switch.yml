# Portions Copyright 2026 The Hollycast Authors
name: Nintendo Switch

on:
  workflow_dispatch:

jobs:
  build:
    name: Switch ${{ matrix.config.name }}
    runs-on: ubuntu-latest
    # SDK bump: inspect the candidate digest, then run both Release install variants below.
    container: devkitpro/devkita64@sha256:82575ea78651b530b2e232bb3799cfd1fe331514e053d5f724bb4b28191fb79d

    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    strategy:
      matrix:
        config:
          - { name: standalone, destDir: switch }
          - { name: libretro, cmakeArgs: -DLIBRETRO=ON }

    steps:
      - name: Set up build environment
        run: |
          sudo apt-get update
          sudo apt-get -y install ccache gh

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Mark git repository as safe
        run: git config --global --add safe.directory $PWD

      - uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-switch-${{ matrix.config.name }}-${{ hashFiles('.github/workflows/switch.yml') }}-${{ github.sha }}
          restore-keys: ccache-switch-${{ matrix.config.name }}-${{ hashFiles('.github/workflows/switch.yml') }}-

      - name: CMake
        env:
          HOLLYCAST_SCREENSCRAPER_DEV_ID: ${{ matrix.config.name == 'standalone' && secrets.HOLLYCAST_SCREENSCRAPER_DEV_ID || '' }}
          HOLLYCAST_SCREENSCRAPER_DEV_PASSWORD: ${{ matrix.config.name == 'standalone' && secrets.HOLLYCAST_SCREENSCRAPER_DEV_PASSWORD || '' }}
          HOLLYCAST_REQUIRE_SCREENSCRAPER: ${{ matrix.config.name == 'standalone' && github.repository == 'nexus382/Hollycast' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        run: |
          $DEVKITPRO/portlibs/switch/bin/aarch64-none-elf-cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=artifact -G Ninja ${{ matrix.config.cmakeArgs }}
          cmake --build build --config Release --target install

      - uses: actions/upload-artifact@v7
        with:
          name: Hollycast-switch-${{ matrix.config.name }}
          path: |
            artifact/bin
            artifact/lib/libretro

      - name: Package app
        run: zip -m artifact/bin/Hollycast.nro.zip artifact/bin/Hollycast.nro
        if: hashFiles('artifact/bin/Hollycast.nro') != ''

      - name: Setup Rclone
        uses: AnimMouse/setup-rclone@v1
        with:
          rclone_config: ${{ secrets.RCLONE_CONFIG }}

      - name: Upload to S3
        run: rclone copy artifact/bin scaleway:Hollycast-builds/${{ matrix.config.destDir }}/${GITHUB_REF#refs/}-$GITHUB_SHA
        if: github.repository == 'OrangeFox86/Hollycast' && github.event_name == 'push' && matrix.config.destDir != ''
